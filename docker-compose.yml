services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: jooservices/crawlerx-news:php85
    working_dir: /app
    volumes:
      - .:/app
      - crawlerxnews_node_modules:/app/node_modules
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      CRAWLERXNEWS_FLARESOLVERR_URL: http://flaresolverr:8191/v1
      CRAWLERXNEWS_BROWSER_SERVICE_URL: http://node:3000
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    tty: true

  node:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CRAWLERXNEWS_NODE: node
      CRAWLERXNEWS_PLAYWRIGHT_SCRIPT: /app/scripts/playwright-fetch.mjs
      CRAWLERXNEWS_BROWSER_SERVICE_PORT: 3000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    profiles: ["fetch"]
    init: true
    command: ["sh", "-lc", "npm ci --ignore-scripts && node scripts/fetch-server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    profiles: ["fetch"]
    environment:
      LOG_LEVEL: info
    restart: unless-stopped

volumes:
  crawlerxnews_node_modules: