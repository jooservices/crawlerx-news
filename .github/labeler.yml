documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Makefile'
          - 'Dockerfile'
          - 'docker-compose.yml'

php:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'tests/**'
          - 'composer.json'