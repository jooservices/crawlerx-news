# Dedicated CI for jooservices/crawlerx-news — GitHub-hosted runners
# Post-merge sanity on master/develop heads. Full PR gate lives in ci.yml.
name: CI post-merge

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer validate
        run: tools/ci/docker-compose run --rm php composer validate --strict

  test:
    name: Test (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Unit
            suite: Unit
          - name: Feature
            suite: Feature
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run test suite with coverage
        run: |
          mkdir -p build/coverage
          tools/ci/docker-compose run --rm php ./vendor/bin/phpunit \
            --testsuite=${{ matrix.suite }} \
            --coverage-clover=build/coverage/clover-${{ matrix.suite }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-post-merge-${{ matrix.suite }}
          path: build/coverage/clover-${{ matrix.suite }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage upload
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-post-merge-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage and merge Clover reports
        run: |
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Unit.xml
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Feature.xml
          tools/ci/docker-compose run --rm php php tools/coverage-merge.php \
            build/coverage/matrix/clover-Unit.xml \
            build/coverage/matrix/clover-Feature.xml \
            build/coverage/clover-combined.xml
          ls -la build/coverage